spring:
  application:
    name: preppal-backend

  datasource:
    # Postgres connection (Neon). Set via env in backend/.env or the shell.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/preppal}
    username: ${DATABASE_USER:preppal}
    password: ${DATABASE_PASSWORD:preppal}

  jpa:
    hibernate:
      ddl-auto: none          # Flyway fully owns the schema
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

# App-specific config
preppal:
  jwt:
    # 256-bit secret (override in prod!). Base64 or plain long string.
    secret: ${JWT_SECRET:change-me-in-prod-this-is-a-long-dev-only-secret-key-0123456789}
    # token validity in milliseconds (7 days)
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  ai:
    # Default failover order (question generation etc.) — first configured wins, then falls through.
    failover: ${AI_FAILOVER:ZHIPU,GEMINI,GROQ}
    # Scoring uses Gemini first (more consistent technical judging); Zhipu/Groq behind it.
    failover-score: ${AI_FAILOVER_SCORE:GEMINI,ZHIPU,GROQ}
  zhipu:
    api-key: ${ZHIPU_API_KEY:}
    model: ${ZHIPU_MODEL:glm-4.5-flash}
    base-url: ${ZHIPU_BASE_URL:https://api.z.ai/api/paas/v4}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}   # 2.0 series was retired Mar 2026 (returns limit:0)
    base-url: https://generativelanguage.googleapis.com/v1beta
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    base-url: https://api.groq.com/openai/v1
  free:
    monthly-mocks: ${FREE_MONTHLY_MOCKS:20}   # free mocks per user per month

logging:
  level:
    org.springframework.security: INFO
